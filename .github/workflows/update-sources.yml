  name: Update comic source list

  on:
    schedule:
      - cron: '37 3 * * *'
    workflow_dispatch: {}

  permissions:
    contents: write

  concurrency:
    group: update-source-list
    cancel-in-progress: false

  jobs:
    update:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Regenerate source list
          run: python update_sources.py

        - name: Commit and push if changed
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet venera-source-list.json; then
              git add venera-source-list.json
              git commit -m "chore: update source list [skip ci]"
              git push
              echo "updated and pushed"
            else
              echo "no change"
            fi
